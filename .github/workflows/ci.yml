name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.x
          cache: true
      - name: Validate real exchanges, examples and coverage manifest
        run: make test-contract

  chaos-deterministic:
    name: Deterministic fault windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.x
          cache: true
      - name: Exercise protocol fault windows
        run: make test-chaos

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: payments
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3.5-management
        env:
          RABBITMQ_DEFAULT_USER: payments
          RABBITMQ_DEFAULT_PASS: payments_local
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.x
          cache: true
      - name: Run serial isolated suite
        run: make test-e2e
        env:
          E2E_ALLOW_DESTRUCTIVE_CLEANUP: "YES"
          E2E_DATABASE_URL: postgres://payments:payments_local@127.0.0.1:5432/payments?sslmode=disable
          E2E_RABBITMQ_URL: amqp://payments:payments_local@127.0.0.1:5672/

  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: payments
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3.5-management
        env:
          RABBITMQ_DEFAULT_USER: payments
          RABBITMQ_DEFAULT_PASS: payments_local
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.x
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify generated code
        run: |
          make generate
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
        env:
          TEST_DATABASE_URL: postgres://payments:payments_local@localhost:5432/payments?sslmode=disable
          TEST_RABBITMQ_URL: amqp://payments:payments_local@localhost:5672/

      - name: Check vulnerabilities
        run: go tool govulncheck ./...

      - name: Build commands
        run: go build ./cmd/...

      # golangci-lint v2.12.2 does not support Go 1.27 syntax yet. Keep the
      # application checks above on Go 1.27 and run only the linter with the
      # module's minimum supported Go version.
      - name: Set up Go for lint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.x
          cache: true

      - name: Lint
        run: go tool golangci-lint run

      - name: Validate Compose
        run: docker compose config --quiet

  compatibility:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [1.26.x, 1.27.x]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Test
        run: go test ./...

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: payments-boilerplate:ci
          cache-from: type=gha,scope=payments-boilerplate
          cache-to: type=gha,scope=payments-boilerplate,mode=max
