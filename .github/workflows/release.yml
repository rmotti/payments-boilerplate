name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  chaos-gate:
    name: Prolonged chaos at release SHA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: payments
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3.5-management
        env:
          RABBITMQ_DEFAULT_USER: payments
          RABBITMQ_DEFAULT_PASS: payments_local
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache: true
      - name: Run prolonged recovery suite
        run: make test-chaos-long
        env:
          CHAOS_DESTRUCTIVE_ALLOWED: "1"
          TEST_DATABASE_URL: postgres://payments:payments_local@127.0.0.1:5432/payments?sslmode=disable
          TEST_RABBITMQ_URL: amqp://payments:payments_local@127.0.0.1:5672/

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [chaos-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist/package
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            package="payments-boilerplate_${VERSION}_${os}_${arch}"
            package_dir="dist/package/${package}"
            mkdir -p "${package_dir}"
            for command in api worker migrate; do
              CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath \
                -ldflags="-s -w -X github.com/rmotti/payments-boilerplate/internal/platform/buildinfo.Version=${VERSION} -X github.com/rmotti/payments-boilerplate/internal/platform/buildinfo.Commit=${COMMIT}" \
                -o "${package_dir}/${command}" "./cmd/${command}"
            done
            tar -C dist/package -czf "dist/${package}.tar.gz" "${package}"
          done
          sha256sum dist/*.tar.gz > dist/checksums.txt

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=payments-boilerplate
          cache-to: type=gha,scope=payments-boilerplate,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt --generate-notes --verify-tag
