name: Post-deploy

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

concurrency:
  group: post-deploy-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Railway smoke test
    if: >-
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'production' ||
      endsWith(github.event.deployment.environment, ' / production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all Railway services deployed
        env:
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Railway reports one deployment status per service. Give sibling
          # services a moment to publish theirs before evaluating the project.
          sleep 10
          statuses="$(gh api \
            "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            --jq '.[].state')"
          printf 'Railway service states:\n%s\n' "${statuses}"
          if grep -Eq '^(error|failure)$' <<<"${statuses}"; then
            echo '::error::Railway reported a partial deployment failure. Inspect the failed service runtime logs.'
            exit 1
          fi

      - name: Verify API readiness
        env:
          API_URL: ${{ vars.RAILWAY_API_URL }}
        run: |
          test -n "${API_URL}"
          health_url="${API_URL%/}/health"
          response_file="${RUNNER_TEMP}/api-health-response.txt"
          status=000
          for attempt in {1..18}; do
            if status="$(curl --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              --output "${response_file}" --write-out '%{http_code}' \
              "${health_url}")" && [[ "${status}" == 2* ]]; then
              cat "${response_file}"
              exit 0
            fi
            echo "API readiness attempt ${attempt}/18 returned HTTP ${status}"
            if (( attempt < 18 )); then
              sleep 5
            fi
          done
          echo "::error::API did not become ready at ${health_url}; last HTTP status: ${status}"
          if [[ -s "${response_file}" ]]; then
            echo 'Last response body:'
            cat "${response_file}"
          fi
          exit 1
