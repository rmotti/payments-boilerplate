openapi: 3.1.0
info:
  title: Payments Boilerplate API
  version: 0.1.0
  description: API headless de referencia para integracoes de pagamento.
servers:
  - url: /
security:
  - integrationApiKey: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Retorna a disponibilidade do processo e de suas dependencias.
      tags: [Operations]
      security: []
      responses:
        "200":
          description: Processo pronto para receber trabalho.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Uma dependencia obrigatoria esta indisponivel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/orders:
    post:
      operationId: createOrder
      summary: Cria um pedido a partir de um produto conhecido pelo servidor.
      description: |
        O valor e a moeda do pedido sao calculados no servidor a partir do
        catalogo. O cliente informa apenas o produto e a quantidade; nenhum
        valor enviado na requisicao e aceito como preco.
      tags: [Orders]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            examples:
              demo:
                summary: Um produto de demonstracao.
                value:
                  productId: product_demo
                  quantity: 1
      responses:
        "201":
          description: Pedido criado com valor calculado no servidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              examples:
                pending:
                  value:
                    id: ord_3f2504e04f8911d39a0c0305e82c3301
                    status: pending
                    amount: 10000
                    currency: BRL
        "400":
          description: Corpo, header ou campos da requisicao invalidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidQuantity:
                  value:
                    code: invalid_request
                    message: quantity must be between 1 and 1000
                    correlationId: 6f1d2c0a4b8e4f6c9d1e2f3a4b5c6d7e
        "401":
          description: Chave de integracao ausente ou invalida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    message: authentication required
                    correlationId: 6f1d2c0a4b8e4f6c9d1e2f3a4b5c6d7e
        "404":
          description: O produto informado nao existe no catalogo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownProduct:
                  value:
                    code: product_not_found
                    message: product not found
                    correlationId: 6f1d2c0a4b8e4f6c9d1e2f3a4b5c6d7e
        "409":
          description: A Idempotency-Key ja foi usada por outro pedido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                reusedKey:
                  value:
                    code: idempotency_key_conflict
                    message: idempotency key already used
                    correlationId: 6f1d2c0a4b8e4f6c9d1e2f3a4b5c6d7e
        "413":
          description: O corpo da requisicao excede o limite aceito pela API.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tooLarge:
                  value:
                    code: invalid_request
                    message: request body too large
                    correlationId: 6f1d2c0a4b8e4f6c9d1e2f3a4b5c6d7e
        "500":
          description: Falha inesperada ao criar o pedido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                internal:
                  value:
                    code: internal_error
                    message: internal error
                    correlationId: 6f1d2c0a4b8e4f6c9d1e2f3a4b5c6d7e
  /v1/orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrder
      summary: Retorna o estado local atual de um pedido.
      tags: [Orders]
      responses:
        "200":
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Chave de integracao ausente ou invalida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Pedido nao encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falha inesperada ao consultar o pedido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/orders/{orderId}/checkout:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      operationId: createCheckout
      summary: Cria ou recupera uma sessao hospedada de pagamento.
      description: |
        Usa exclusivamente o valor e a moeda persistidos no pedido. Repetir a
        mesma Idempotency-Key para o mesmo pedido devolve a sessao original.
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Sessao de Checkout pronta para redirecionamento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkout"
        "400":
          description: Header de idempotencia ausente ou invalido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Chave de integracao ausente ou invalida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Pedido nao encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Chave reutilizada em outro pedido, pedido nao pagavel ou outro checkout ativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: O provedor de pagamentos nao respondeu com uma sessao valida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Falha inesperada ao iniciar o checkout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      summary: Recebe um evento assinado pela Stripe.
      description: |
        Endpoint destinado a Stripe, nao ao sistema integrador. Nao usa a chave
        de integracao: a confianca vem da verificacao criptografica do header
        Stripe-Signature sobre os bytes exatos do corpo.

        ATENCAO ao media type: a Stripe envia Content-Type application/json,
        mas o contrato declara application/octet-stream de proposito. A
        assinatura cobre os bytes exatos do corpo, e declarar application/json
        faria o servidor desserializar e reserializar o conteudo antes da
        verificacao, mudando ordem de chaves e espacos e invalidando qualquer
        assinatura legitima. O corpo e tratado como opaco ate ser verificado.

        A consequencia e que ferramentas que validam o media type estritamente
        podem apontar incompatibilidade entre o enviado e o declarado. O
        servidor aceita a requisicao normalmente: o Content-Type recebido nao e
        usado para escolher como ler o corpo.

        A operacao apenas registra o evento de forma duravel e cria, na mesma
        transacao, a mensagem que sera publicada. Nenhum estado de pagamento
        muda dentro desta requisicao.

        Cada status e uma instrucao de reentrega para a Stripe: 2xx encerra as
        tentativas, qualquer outro codigo faz o evento ser reenviado.
      tags: [Payments]
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: false
          description: |
            Assinatura do corpo bruto. Declarado como opcional para que a
            ausencia seja tratada pelo mesmo caminho de uma assinatura
            invalida, com o codigo de erro invalid_signature.
          schema:
            type: string
          example: t=1719000000,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: |
                Evento JSON assinado pela Stripe, tratado como sequencia opaca
                de bytes ate que a assinatura seja verificada.
      responses:
        "202":
          description: |
            Evento novo aceito de forma duravel e enfileirado para
            processamento assincrono.
        "200":
          description: |
            Nada a fazer: o evento ja havia sido recebido antes, ou e de um
            tipo que a aplicacao nao trata e foi apenas registrado.
        "400":
          description: Assinatura ausente, invalida ou fora da janela de tempo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidSignature:
                  value:
                    code: invalid_signature
                    message: webhook signature could not be verified
                    correlationId: 6f1d2c0a4b8e4f6c9d1e2f3a4b5c6d7e
        "500":
          description: |
            O evento nao pode ser registrado. Devolvido tambem quando o corpo
            excede o limite do endpoint, porque nesse caso uma reentrega passa
            a funcionar depois que o limite for corrigido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                internal:
                  value:
                    code: internal_error
                    message: internal error
                    correlationId: 6f1d2c0a4b8e4f6c9d1e2f3a4b5c6d7e
components:
  securitySchemes:
    integrationApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Chave secreta do backend integrador.
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: Identificador publico opaco do pedido.
      schema:
        type: string
        pattern: '^ord_[0-9a-f]{32}$'
      example: ord_3f2504e04f8911d39a0c0305e82c3301
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chave opaca escolhida pelo cliente que identifica esta operacao. Deve
        ter entre 1 e 255 caracteres. Reenviar a mesma chave nao cria um
        segundo pedido.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 8c1f5f2e-9a3b-4c2d-8e7f-1a2b3c4d5e6f
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        service:
          type: string
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [up, down]
    CreateOrderRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          description: Identificador de um produto conhecido pelo servidor.
          minLength: 1
          maxLength: 128
        quantity:
          type: integer
          description: Quantidade de unidades do produto.
          minimum: 1
          maximum: 1000
    Order:
      type: object
      required: [id, status, amount, currency]
      properties:
        id:
          type: string
          description: Identificador publico opaco e nao sequencial.
        status:
          $ref: "#/components/schemas/OrderStatus"
        amount:
          type: integer
          format: int64
          description: Valor total na menor unidade da moeda, calculado no servidor.
        currency:
          type: string
          description: Codigo ISO 4217 da moeda.
    OrderStatus:
      type: string
      description: Estado comercial do pedido.
      enum: [pending, paid, cancelled, expired]
    Checkout:
      type: object
      required: [checkoutUrl, expiresAt]
      properties:
        checkoutUrl:
          type: string
          format: uri
          description: URL HTTPS hospedada pela Stripe.
        expiresAt:
          type: string
          format: date-time
          description: Instante em que a sessao deixa de aceitar pagamento.
    Error:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          description: Codigo estavel do erro, adequado para tratamento programatico.
        message:
          type: string
          description: Descricao legivel do erro, sem dados sensiveis.
        correlationId:
          type: string
          description: Identificador de correlacao da requisicao, igual ao header X-Correlation-ID.
